<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/input.css" />
    <link rel="shortcut icon" href="drum-kit-favicon.png" type="image/x-icon" />
    <script defer src="js/main.js"></script>
    <title>Drum Kit</title>
  </head>
  <body
    class="bg-[#FEE715] text-[#101820] dark:bg-[#101820] dark:text-[#FEE715] min-h-screen grid place-content-center"
  >
    <h1
      class="font-bold text-5xl select-none absolute underline top-[10%] left-[50%] translate-x-[-50%] underline-offset-8 whitespace-nowrap"
    >
      DRUM KIT
    </h1>
    <div class="toggle absolute top-[3%] right-[5%] cursor-pointer">
      <div class="light hidden" title="Light Mode">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="30"
          height="30"
          fill="white"
          class="bi bi-yin-yang"
          viewBox="0 0 16 16"
        >
          <path
            d="M9.167 4.5a1.167 1.167 0 1 1-2.334 0 1.167 1.167 0 0 1 2.334 0Z"
          />
          <path
            d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0ZM1 8a7 7 0 0 1 7-7 3.5 3.5 0 1 1 0 7 3.5 3.5 0 1 0 0 7 7 7 0 0 1-7-7Zm7 4.667a1.167 1.167 0 1 1 0-2.334 1.167 1.167 0 0 1 0 2.334Z"
          />
        </svg>
      </div>

      <div class="dark hidden" title="Dark Mode">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="30"
          height="30"
          fill="black"
          class="bi bi-yin-yang"
          viewBox="0 0 16 16"
        >
          <path
            d="M9.167 4.5a1.167 1.167 0 1 1-2.334 0 1.167 1.167 0 0 1 2.334 0Z"
          />
          <path
            d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0ZM1 8a7 7 0 0 1 7-7 3.5 3.5 0 1 1 0 7 3.5 3.5 0 1 0 0 7 7 7 0 0 1-7-7Zm7 4.667a1.167 1.167 0 1 1 0-2.334 1.167 1.167 0 0 1 0 2.334Z"
          />
        </svg>
      </div>
    </div>
    <div class="mx-5">
      <div class="keys grid grid-cols-3 md:grid-cols-9 md:gap-6 lg:gap-8 gap-4">
        <div
          data-key="65"
          class="key flex flex-col items-center justify-center border-yellow-700 dark:border-yellow-600 border-4 bg-[rgba(0,0,0,0.05)] duration-200 select-none"
        >
          <kbd class="font-semibold text-2xl">A</kbd>
          <span class="sound">clap</span>
        </div>
        <div
          data-key="83"
          class="key key flex flex-col items-center justify-center border-yellow-700 dark:border-yellow-600 border-4 bg-[rgba(0,0,0,0.05)] duration-200 select-none"
        >
          <kbd class="font-semibold text-2xl">S</kbd>
          <span class="sound">hihat</span>
        </div>
        <div
          data-key="68"
          class="key key flex flex-col items-center justify-center border-yellow-700 dark:border-yellow-600 border-4 bg-[rgba(0,0,0,0.05)] duration-200 select-none"
        >
          <kbd class="font-semibold text-2xl">D</kbd>
          <span class="sound">kick</span>
        </div>
        <div
          data-key="70"
          class="key key flex flex-col items-center justify-center border-yellow-700 dark:border-yellow-600 border-4 bg-[rgba(0,0,0,0.05)] duration-200 select-none"
        >
          <kbd class="font-semibold text-2xl">F</kbd>
          <span class="sound">openhat</span>
        </div>
        <div
          data-key="71"
          class="key key flex flex-col items-center justify-center border-yellow-700 dark:border-yellow-600 border-4 bg-[rgba(0,0,0,0.05)] duration-200 select-none"
        >
          <kbd class="font-semibold text-2xl">G</kbd>
          <span class="sound">boom</span>
        </div>
        <div
          data-key="72"
          class="key key flex flex-col items-center justify-center border-yellow-700 dark:border-yellow-600 border-4 bg-[rgba(0,0,0,0.05)] duration-200 select-none"
        >
          <kbd class="font-semibold text-2xl">H</kbd>
          <span class="sound">ride</span>
        </div>
        <div
          data-key="74"
          class="key key flex flex-col items-center justify-center border-yellow-700 dark:border-yellow-600 border-4 bg-[rgba(0,0,0,0.05)] duration-200 select-none"
        >
          <kbd class="font-semibold text-2xl">J</kbd>
          <span class="sound">snare</span>
        </div>
        <div
          data-key="75"
          class="key key flex flex-col items-center justify-center border-yellow-700 dark:border-yellow-600 border-4 bg-[rgba(0,0,0,0.05)] duration-200 select-none"
        >
          <kbd class="font-semibold text-2xl">K</kbd>
          <span class="sound">tom</span>
        </div>
        <div
          data-key="76"
          class="key key flex flex-col items-center justify-center border-yellow-700 dark:border-yellow-600 border-4 bg-[rgba(0,0,0,0.05)] duration-200 select-none"
        >
          <kbd class="font-semibold text-2xl">L</kbd>
          <span class="sound">tink</span>
        </div>
      </div>

      <audio data-key="65" src="sounds/clap.wav"></audio>
      <audio data-key="83" src="sounds/hihat.wav"></audio>
      <audio data-key="68" src="sounds/kick.wav"></audio>
      <audio data-key="70" src="sounds/openhat.wav"></audio>
      <audio data-key="71" src="sounds/boom.wav"></audio>
      <audio data-key="72" src="sounds/ride.wav"></audio>
      <audio data-key="74" src="sounds/snare.wav"></audio>
      <audio data-key="75" src="sounds/tom.wav"></audio>
      <audio data-key="76" src="sounds/tink.wav"></audio>
    </div>
  </body>
</html>
