<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/input.css" />
    <link rel="shortcut icon" href="clock-favicon.png" type="image/x-icon" />
    <script defer src="js/main.js"></script>
    <title>Clock</title>
  </head>
  <body
    class="bg-[#FEE715] text-[#101820] dark:bg-[#101820] dark:text-[#FEE715] grid place-content-center min-h-screen"
  >
    <h1
      class="font-bold text-6xl select-none absolute underline top-[10%] left-[50%] translate-x-[-50%] underline-offset-8 whitespace-nowrap"
    >
      CLOCK
    </h1>

    <div class="toggle absolute top-[3%] right-[5%] cursor-pointer">
      <div class="light hidden" title="Light Mode">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="30"
          height="30"
          fill="white"
          class="bi bi-yin-yang"
          viewBox="0 0 16 16"
        >
          <path
            d="M9.167 4.5a1.167 1.167 0 1 1-2.334 0 1.167 1.167 0 0 1 2.334 0Z"
          />
          <path
            d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0ZM1 8a7 7 0 0 1 7-7 3.5 3.5 0 1 1 0 7 3.5 3.5 0 1 0 0 7 7 7 0 0 1-7-7Zm7 4.667a1.167 1.167 0 1 1 0-2.334 1.167 1.167 0 0 1 0 2.334Z"
          />
        </svg>
      </div>

      <div class="dark hidden" title="Dark Mode">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="30"
          height="30"
          fill="black"
          class="bi bi-yin-yang"
          viewBox="0 0 16 16"
        >
          <path
            d="M9.167 4.5a1.167 1.167 0 1 1-2.334 0 1.167 1.167 0 0 1 2.334 0Z"
          />
          <path
            d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0ZM1 8a7 7 0 0 1 7-7 3.5 3.5 0 1 1 0 7 3.5 3.5 0 1 0 0 7 7 7 0 0 1-7-7Zm7 4.667a1.167 1.167 0 1 1 0-2.334 1.167 1.167 0 0 1 0 2.334Z"
          />
        </svg>
      </div>
    </div>

    <div>
      <div
        class="border-[12px] border-[#101820] dark:border-white w-72 h-72 rounded-[50%] relative before:absolute before:w-5 before:h-5 before:bg-[#101820] before:dark:bg-[#FEE715] before:z-50 before:rounded-[50%] before:top-[50%] before:left-[50%] before:translate-x-[-50%] before:translate-y-[-50%]"
      >
        <div
          class="hand hour w-[50%] h-2 dark:bg-white bg-[#101820] origin-[100%] absolute top-[50%] translate-y-[-50%] rotate-90"
        ></div>
        <div
          class="hand minute w-[50%] h-1 dark:bg-white bg-[#101820] origin-[100%] absolute top-[50%] translate-y-[-50%] rotate-90"
        ></div>
        <div
          class="hand second w-[50%] h-0.5 dark:bg-white bg-[#101820] origin-[100%] absolute top-[50%] translate-y-[-50%] rotate-90"
        ></div>
      </div>
    </div>
  </body>
</html>
